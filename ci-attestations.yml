# prooft's own attestation policy (GATE-010). CI reads this from the PR base.
version: 1
mode: shadow
lanes:
  # A proof stays valid across a rebase / a moved main while these files are unchanged.
  lint:
    max-age-hours: 24
    # ruff format also checks Markdown code blocks, so *.md is a lint input
    inputs: ["src/**", "tests/**", "ci/**", ci.py, pyproject.toml, uv.lock, "**/*.md"]
  tests:
    max-age-hours: 24
    inputs: ["src/**", "tests/**", "ci/**", ci.py, pyproject.toml, uv.lock]
gates:
  python/all/fmt: {lane: lint}
  python/all/lint: {lane: lint}
  python/all/types: {lane: lint}
  python/linux-x64/test: {lane: tests}
jobs:
  ci.yml:fast: [python/all/fmt, python/all/lint, python/all/types]
  ci.yml:test-linux-x64: [python/linux-x64/test]
